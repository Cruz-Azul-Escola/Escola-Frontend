<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/stylePopUpExcluirDados.css">
    <title>Alterar Dados</title>
</head>
<body>
    <div class="overlay">
        <div class="modal">
          <div id="cabecalho-iframe">
            <h2>Excluir</h2>
            <button id="fechar">✕</button>
          </div>
          <form>
            <div>
              <label>ID</label>
              <input name="id" required>
            </div>
      
            <div>
              <label>ID Confirmação</label>
              <input name="idConfirmacao" required>
            </div>
      
            <button id="salvar" class="confirmar" type="submit">Salvar Notas</button>
          </form>
        </div>
    </div>
</body>
</html>
